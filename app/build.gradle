plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kyu.ebb'
    compileSdk 34

    defaultConfig {
        applicationId 'com.kyu.ebb'
        minSdk 26
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
        versionName '2.0.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    signingConfigs {
        release {
            // Personal-use key kept in this private repo so every build installs over the last one.
            storeFile file('ebb-personal.keystore')
            storePassword 'ebbpersonal'
            keyAlias 'ebb'
            keyPassword 'ebbpersonal'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
